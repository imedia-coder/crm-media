workflows:
  ios-ad-hoc:
    name: TelePrompt iOS (ad-hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile

    integrations:
      app_store_connect: codemagic_api_key

    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: "com.imedia.teleprompt.telepromptMobile"
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build IPA for ad-hoc distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=$CM_EXPORT_OPTIONS_PLIST

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - contact.initiativas@gmail.com
        notify:
          success: true
          failure: true
