workflows:
  ios-ad-hoc:
    name: TelePrompt iOS (ad-hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.imedia.teleprompt.teleprompt_mobile"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    integrations:
      app_store_connect: codemagic_api_key

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Set up code signing (ad-hoc)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build IPA for ad-hoc distribution
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - contact.initiativas@gmail.com
        notify:
          success: true
          failure: true
